<!doctype html>
<meta charset="utf-8">
<title>LinkJar</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; margin: 1.5rem 0; }
  input { flex: 1; padding: .5rem; border: 1px solid #8884; border-radius: 6px; font: inherit; }
  button { padding: .5rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
  li { margin: .4rem 0; }
  small { opacity: .6; }
</style>
<h1>LinkJar</h1>
<p><small>Example app for the shipops-stack test harnesses.</small></p>
<form id="f">
  <input id="url" placeholder="https://example.com" required>
  <input id="title" placeholder="title (optional)">
  <button>Save</button>
</form>
<ul id="list"></ul>
<script>
  const list = document.getElementById('list');
  async function load() {
    const links = await (await fetch('/api/links')).json();
    list.innerHTML = links.map(l =>
      `<li><a href="${l.url}">${l.title || l.url}</a> <small>${new Date(l.created_at).toLocaleString()}</small></li>`
    ).join('') || '<li><small>Nothing saved yet.</small></li>';
  }
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    await fetch('/api/links', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url: url.value, title: title.value }),
    });
    e.target.reset();
    load();
  };
  load();
</script>
